name: Link check

# The slow death of every directory is link rot, not bad code. This runs
# weekly and opens a single issue listing whatever stopped resolving.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --retry-wait-time 5
            --max-retries 2
            --accept 200,206,301,302,303,307,308,999
            --exclude-path node_modules
            'src/content/entries/**/*.md'
          output: lychee.md
          fail: false

      - name: Open an issue for anything broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Links needing attention
          content-filepath: lychee.md
          labels: correction, link-rot
