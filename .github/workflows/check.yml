name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # Schema violations fail the site build; compiling the Worker here also
      # catches routing or runtime dependency regressions before deployment.
      - run: npm run build
